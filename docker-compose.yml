services:
  # 1. The Brain: SuperTokens Authentication Engine
  supertokens:
    image: supertokens/supertokens-postgresql:9.1.1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3567:3567"
    environment:
      # Use SUPERTOKENS_DATABASE_URL from .env for Managed Postgres (e.g. DigitalOcean); otherwise local db:5432/supertokens
      POSTGRESQL_CONNECTION_URI: "${SUPERTOKENS_DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/supertokens}"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - indie_network
    restart: unless-stopped
    healthcheck:
      test: >
        bash -c 'exec 3<> /dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. Local Valkey (Redis-protocol cache; for API caching)
  valkey:
    image: valkey/valkey:7-alpine
    ports:
      - "6379:6379"
    networks:
      - indie_network
    restart: unless-stopped

  # 3. The Muscle: FastAPI Engine (Python)
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      valkey:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
      - WEB_HOST=http://localhost:3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/movieshaker
      - VALKEY_URL=redis://valkey:6379/0
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT:-}
      - DO_SPACES_REGION=${DO_SPACES_REGION:-}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET:-}
      - DO_SPACES_ACCESS_KEY_ID=${DO_SPACES_ACCESS_KEY_ID:-}
      - DO_SPACES_SECRET_ACCESS_KEY=${DO_SPACES_SECRET_ACCESS_KEY:-}
    networks:
      - indie_network
    volumes:
      - ./engine:/app
    restart: unless-stopped

  # 4. Reverse proxy: HTTPS for api.movieshaker.com -> engine
  caddy:
    image: caddy:alpine
    depends_on:
      engine:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - indie_network
    restart: unless-stopped

  # 5. The Face: Next.js Web (Development Mode)
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npx next dev -H 0.0.0.0"
    networks:
      - indie_network

  # 6. The Memory: Postgres (Local Dev Only)
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-movieshaker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - indie_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-movieshaker}" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  indie_network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
