services:
  # 1. The Brain: SuperTokens Authentication Engine
  supertokens:
    image: supertokens/supertokens-postgresql:9.1.1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3567:3567"
    environment:
      # Use SUPERTOKENS_DATABASE_URL from .env for Managed Postgres (e.g. DigitalOcean); otherwise local db:5432/supertokens
      POSTGRESQL_CONNECTION_URI: "${SUPERTOKENS_DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/supertokens}"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - indie_network
    restart: unless-stopped
    healthcheck:
      test: >
        bash -c 'exec 3<> /dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. Local Valkey (Redis-protocol cache; for API caching)
  valkey:
    image: valkey/valkey:7-alpine
    ports:
      - "6379:6379"
    networks:
      - indie_network
    restart: unless-stopped

  # 3. The Muscle: FastAPI Engine (Python)
  # No bind mount: reading app code from the image avoids macOS Docker errno 35 (resource deadlock).
  # For engine code changes: rebuild with `docker compose build engine && docker compose up -d engine`,
  # or run the engine locally (e.g. uvicorn main:app --reload) and keep only db/supertokens/valkey in Docker.
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      valkey:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - WEBSITE_DOMAIN=${WEBSITE_DOMAIN:-http://localhost:3000}
      - WEB_HOST=${WEBSITE_DOMAIN:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/movieshaker}
      - VALKEY_URL=redis://valkey:6379/0
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT:-}
      - DO_SPACES_REGION=${DO_SPACES_REGION:-}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET:-}
      - DO_SPACES_ACCESS_KEY_ID=${DO_SPACES_ACCESS_KEY_ID:-}
      - DO_SPACES_SECRET_ACCESS_KEY=${DO_SPACES_SECRET_ACCESS_KEY:-}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-}
      - GATEWAY_INTERNAL_API_KEY=${GATEWAY_INTERNAL_API_KEY:-}
      - GATEWAY_TIMEOUT_SECONDS=${GATEWAY_TIMEOUT_SECONDS:-45}
      - GATEWAY_VERIFY_TLS=${GATEWAY_VERIFY_TLS:-true}
    networks:
      - indie_network
    restart: unless-stopped

  # 4. Reverse proxy: HTTPS for api.movieshaker.com -> engine
  caddy:
    image: caddy:alpine
    depends_on:
      engine:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - indie_network
    restart: unless-stopped

  # 5. The Face: Next.js Web (Development Mode)
  # node_modules on a named volume reduces bind-mount I/O and can avoid errno -35 / tsconfig read failures on macOS.
  # If you still see "Cannot read file tsconfig.json" or "Unknown system error -35", run web locally:
  #   cd web && npm install && npm run dev  (with engine/db/supertokens/valkey in Docker).
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      # Named volume for .next to avoid bind-mount issues on macOS (ENOENT, error -35).
      - web_next_cache:/app/.next
    ports:
      - "3000:3000"
    # Use webpack (not Turbopack) for more stable behavior with bind mounts in Docker on macOS.
    command: sh -c "npm install && npx next dev --webpack -H 0.0.0.0"
    networks:
      - indie_network

  # 6. The Memory: Postgres (Local Dev Only)
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-movieshaker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - indie_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-movieshaker}" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  indie_network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  web_next_cache:
  web_node_modules:
